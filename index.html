<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSD Food Services — Budget Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,300;9..144,600;9..144,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://apis.google.com/js/api.js"></script>
<script src="https://accounts.google.com/gsi/client"></script>
<style>
:root {
  --teal: #1F6B75;
  --teal2: #2d8a96;
  --teal3: #E6F4F6;
  --teal4: #164e56;
  --ink: #0f0f0f;
  --ink2: #3a3a3a;
  --ink3: #777;
  --ink4: #bbb;
  --bg: #f5f3ee;
  --white: #ffffff;
  --rule: #e2e0da;
  --rule2: #d0cec8;
  --warn: #b84422;
  --warn2: #fdf0eb;
  --green: #1a6e40;
  --green2: #ebf5ef;
  --amber: #8a5c00;
  --amber2: #fdf6e3;
  --mono: 'IBM Plex Mono', monospace;
  --serif: 'Fraunces', serif;
  --radius: 8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--mono);background:var(--bg);color:var(--ink);min-height:100vh;}

/* ── NAV ── */
nav{background:var(--teal4);display:flex;align-items:stretch;padding:0 32px;gap:2px;}
.nav-brand{font-family:var(--serif);font-size:16px;font-weight:600;color:white;display:flex;align-items:center;padding-right:28px;border-right:1px solid rgba(255,255,255,0.15);margin-right:8px;letter-spacing:-0.01em;}
.nav-brand span{font-weight:300;opacity:0.7;margin-left:6px;font-size:13px;}
.nav-tab{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;color:rgba(255,255,255,0.55);background:none;border:none;padding:16px 18px;cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;position:relative;}
.nav-tab:hover{color:rgba(255,255,255,0.85);}
.nav-tab.active{color:white;border-bottom-color:#5ecfdb;}
.nav-badge{background:#5ecfdb;color:var(--teal4);font-size:9px;font-weight:700;padding:1px 5px;border-radius:10px;margin-left:6px;vertical-align:middle;}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.btn-export-xl{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:white;padding:7px 14px;border-radius:5px;cursor:pointer;transition:background .15s;}
.btn-export-xl:hover{background:rgba(255,255,255,0.2);}

/* ── VIEWS ── */
.view{display:none;padding:32px;}
.view.active{display:block;}

/* ── PARSE VIEW ── */
.parse-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:1100px;margin:0 auto;}

/* ── PANEL ── */
.panel{background:var(--white);border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;}
.ph{padding:12px 18px;border-bottom:1px solid var(--rule);background:#fafaf8;display:flex;align-items:center;justify-content:space-between;}
.ph-title{font-size:10px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink3);}
.pb{padding:18px;}

/* mode tabs */
.mode-tabs{display:flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;margin-bottom:14px;}
.mode-tab{flex:1;font-family:var(--mono);font-size:11px;font-weight:500;padding:8px 10px;background:var(--bg);border:none;cursor:pointer;color:var(--ink3);transition:background .15s,color .15s;}
.mode-tab.active{background:var(--teal);color:white;}
.mode-tab:not(.active):hover{background:var(--teal3);color:var(--teal4);}

/* drop zone */
.drop-zone{border:2px dashed var(--rule2);border-radius:8px;padding:32px 20px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;position:relative;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--teal);background:var(--teal3);}
.drop-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.drop-icon{color:var(--ink4);}
.drop-title{font-size:13px;font-weight:500;color:var(--ink2);}
.drop-sub{font-size:11px;color:var(--ink3);}
.drop-sub em{color:var(--teal);font-style:normal;text-decoration:underline;text-underline-offset:2px;}

/* pdf loaded */
.pdf-chip{display:none;align-items:center;gap:10px;padding:10px 12px;background:var(--teal3);border:1px solid #b0dce2;border-radius:6px;margin-bottom:12px;}
.pdf-chip.on{display:flex;}
.pdf-chip-icon{width:30px;height:30px;background:var(--teal);border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.pdf-chip-name{font-size:12px;font-weight:500;color:var(--teal4);flex:1;word-break:break-all;}
.pdf-chip-size{font-size:10px;color:var(--teal2);}
.pdf-chip-rm{background:none;border:none;cursor:pointer;color:var(--teal2);font-size:16px;padding:2px 5px;border-radius:3px;}
.pdf-chip-rm:hover{background:rgba(0,0,0,.08);}

textarea{width:100%;height:230px;font-family:var(--mono);font-size:11px;line-height:1.65;color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:12px;resize:vertical;background:var(--bg);transition:border-color .15s;outline:none;}
textarea:focus{border-color:var(--teal);}
textarea::placeholder{color:var(--ink4);}

.actions{margin-top:12px;display:flex;gap:8px;align-items:center;}
.btn-primary{font-family:var(--mono);font-size:12px;font-weight:500;background:var(--teal);color:white;border:none;padding:9px 20px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:background .15s,transform .1s;letter-spacing:0.02em;}
.btn-primary:hover{background:var(--teal2);}
.btn-primary:active{transform:scale(.98);}
.btn-primary:disabled{background:var(--ink4);cursor:not-allowed;transform:none;}
.btn-ghost{font-family:var(--mono);font-size:11px;color:var(--ink3);background:none;border:1px solid var(--rule);padding:8px 14px;border-radius:6px;cursor:pointer;transition:border-color .15s,color .15s;}
.btn-ghost:hover{border-color:var(--ink3);color:var(--ink2);}
.btn-sample{font-family:var(--mono);font-size:10px;color:var(--teal);background:var(--teal3);border:none;padding:5px 10px;border-radius:4px;cursor:pointer;margin-left:auto;}
.btn-sample:hover{background:#d0eaed;}

@keyframes spin{to{transform:rotate(360deg);}}
.spinner{width:13px;height:13px;border:2px solid rgba(255,255,255,.4);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;display:none;}
.btn-primary.loading .spinner{display:block;}
.btn-primary.loading .lbl{opacity:.7;}

.errbox{background:var(--warn2);border:1px solid #f0c4b4;border-radius:6px;padding:10px 12px;font-size:11px;color:var(--warn);margin-top:10px;display:none;line-height:1.5;}
.errbox.on{display:block;}

/* result */
.result-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:280px;color:var(--ink4);text-align:center;gap:10px;}
.result-empty p{font-size:12px;}
.result-empty.hide{display:none;}
.result-content{display:none;}
.result-content.on{display:block;}

.vendor-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--rule);}
.vendor-name{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-0.02em;color:var(--teal4);}
.vendor-meta{font-size:10px;color:var(--ink3);margin-top:4px;line-height:1.8;}
.inv-badge{font-size:11px;font-weight:500;background:var(--teal3);color:var(--teal4);padding:4px 10px;border-radius:4px;white-space:nowrap;}

.sec-label{font-size:9px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px;}
table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:16px;}
thead th{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:5px 7px;text-align:left;border-bottom:1px solid var(--rule);}
thead th.r{text-align:right;}
tbody tr:nth-child(even){background:#fafaf8;}
tbody td{padding:7px 7px;border-bottom:1px solid #f0f0ec;vertical-align:top;line-height:1.4;}
tbody td.r{text-align:right;color:var(--ink2);}
.item-code{font-size:9px;color:var(--ink4);margin-top:1px;}

.totals{border-top:2px solid var(--ink);padding-top:10px;display:flex;flex-direction:column;align-items:flex-end;gap:5px;margin-bottom:14px;}
.trow{display:flex;gap:20px;font-size:11px;color:var(--ink2);}
.trow .tl{min-width:72px;text-align:right;}
.trow .tv{min-width:72px;text-align:right;}
.trow.grand{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--teal4);border-top:1px solid var(--rule);padding-top:7px;margin-top:2px;}

.flag-box{background:var(--warn2);border-left:3px solid var(--warn);padding:8px 12px;border-radius:0 5px 5px 0;font-size:11px;color:var(--warn);margin-bottom:12px;line-height:1.55;}
.flag-box strong{display:block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;}

/* category assign */
.cat-assign{background:var(--amber2);border:1px solid #e8d49a;border-radius:7px;padding:14px;margin-bottom:14px;}
.cat-assign-title{font-size:9px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin-bottom:10px;}
.cat-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11px;color:var(--ink2);}
.cat-row label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
select.cat-sel{font-family:var(--mono);font-size:11px;border:1px solid #e8d49a;border-radius:4px;padding:4px 8px;background:var(--white);color:var(--ink);outline:none;cursor:pointer;}
select.cat-sel:focus{border-color:var(--teal);}
.btn-commit{font-family:var(--mono);font-size:11px;font-weight:500;background:var(--teal);color:white;border:none;padding:8px 18px;border-radius:6px;cursor:pointer;width:100%;margin-top:10px;transition:background .15s;}
.btn-commit:hover{background:var(--teal2);}

/* ── LEDGER VIEW ── */
.ledger-wrap{max-width:1100px;margin:0 auto;}
.ledger-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.ledger-title{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:-0.02em;color:var(--ink);flex:1;}
.filter-sel{font-family:var(--mono);font-size:11px;border:1px solid var(--rule);border-radius:5px;padding:7px 10px;background:var(--white);color:var(--ink);outline:none;cursor:pointer;}
.filter-sel:focus{border-color:var(--teal);}
.btn-clear-all{font-family:var(--mono);font-size:10px;color:var(--warn);background:none;border:1px solid #f0c4b4;padding:6px 12px;border-radius:5px;cursor:pointer;transition:background .15s;}
.btn-clear-all:hover{background:var(--warn2);}

/* summary cards */
.summary-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
.scard{background:var(--white);border:1px solid var(--rule);border-radius:var(--radius);padding:14px 16px;}
.scard-label{font-size:9px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px;}
.scard-val{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:-0.02em;color:var(--ink);}
.scard-val.teal{color:var(--teal4);}
.scard-sub{font-size:10px;color:var(--ink3);margin-top:3px;}

/* vendor breakdown */
.breakdown-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;}
.bsection-title{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px;}
.vendor-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:11px;}
.vbar-label{width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2);flex-shrink:0;}
.vbar-track{flex:1;background:var(--bg);border-radius:2px;height:6px;overflow:hidden;}
.vbar-fill{height:100%;background:var(--teal);border-radius:2px;transition:width .4s ease;}
.vbar-amt{font-size:10px;color:var(--ink3);width:64px;text-align:right;flex-shrink:0;}

.cat-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:11px;}
.cbar-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.cbar-label{flex:1;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cbar-amt{font-size:10px;color:var(--ink3);}

/* ledger table */
.ledger-table-wrap{background:var(--white);border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;}
.lt{width:100%;border-collapse:collapse;font-size:11px;}
.lt thead th{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:10px 12px;text-align:left;border-bottom:1px solid var(--rule);background:#fafaf8;cursor:pointer;user-select:none;}
.lt thead th.r{text-align:right;}
.lt thead th:hover{color:var(--teal);}
.lt tbody tr{border-bottom:1px solid #f5f3ee;transition:background .1s;}
.lt tbody tr:hover{background:#fafaf9;}
.lt tbody td{padding:9px 12px;vertical-align:top;}
.lt tbody td.r{text-align:right;font-variant-numeric:tabular-nums;}
.lt tbody tr.group-header td{background:#f0eee8;font-size:9px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:6px 12px;border-bottom:none;}
.lt tfoot td{padding:10px 12px;border-top:2px solid var(--ink);font-weight:500;}
.lt tfoot td.r{text-align:right;}

.cat-pill{display:inline-block;font-size:9px;font-weight:500;padding:2px 7px;border-radius:10px;letter-spacing:.03em;}
.inv-link{font-size:10px;color:var(--teal);cursor:pointer;text-decoration:underline;text-underline-offset:2px;}
.del-btn{font-size:10px;color:var(--ink4);background:none;border:none;cursor:pointer;padding:2px 5px;border-radius:3px;transition:color .1s,background .1s;}
.del-btn:hover{color:var(--warn);background:var(--warn2);}

/* empty ledger */
.ledger-empty{text-align:center;padding:60px 20px;color:var(--ink4);}
.ledger-empty p{font-size:12px;margin-top:10px;}

/* raw JSON toggle */
.raw-toggle{font-size:10px;color:var(--ink3);background:none;border:none;cursor:pointer;text-decoration:underline;text-underline-offset:2px;padding:0;}
.raw-toggle:hover{color:var(--teal);}
.raw-block{display:none;margin-top:10px;background:var(--ink);color:#a8f0c0;font-family:var(--mono);font-size:10px;line-height:1.6;padding:12px;border-radius:6px;overflow:auto;white-space:pre;max-height:220px;}
.raw-block.on{display:block;}

/* export bar */
.export-bar{border-top:1px solid var(--rule);padding:10px 18px;background:#fafaf8;display:flex;gap:8px;align-items:center;}
.exp-label{font-size:10px;color:var(--ink3);margin-right:auto;}
.btn-sm{font-family:var(--mono);font-size:10px;background:none;border:1px solid var(--rule);padding:5px 12px;border-radius:4px;cursor:pointer;color:var(--ink2);transition:border-color .15s,color .15s;}
.btn-sm:hover{border-color:var(--teal);color:var(--teal);}

/* api key bar */
.apikey-bar{background:#fffdf5;border-bottom:1px solid #e8d49a;padding:8px 32px;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--amber);}
.apikey-bar label{font-weight:500;white-space:nowrap;}
.apikey-bar input{font-family:var(--mono);font-size:11px;flex:1;max-width:340px;border:1px solid #e8d49a;border-radius:5px;padding:5px 10px;background:var(--white);outline:none;color:var(--ink);}
.apikey-bar input:focus{border-color:var(--teal);}
.apikey-bar input.set{border-color:#6ab07a;background:#f2fbf5;color:var(--green);}
.apikey-status{font-size:10px;color:var(--ink3);}
.apikey-status.ok{color:var(--green);}
.apikey-docs{font-size:10px;color:var(--teal);text-decoration:underline;text-underline-offset:2px;cursor:pointer;white-space:nowrap;}

/* pdf size warning */
.size-warn{background:var(--warn2);border:1px solid #f0c4b4;border-radius:6px;padding:8px 12px;font-size:11px;color:var(--warn);margin-bottom:10px;display:none;line-height:1.5;}
.size-warn.on{display:block;}

/* google auth */
.btn-gauth{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:0.05em;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);color:white;padding:6px 13px;border-radius:5px;cursor:pointer;transition:background .15s;}
.btn-gauth:hover{background:rgba(255,255,255,0.22);}
.btn-gauth.signed-in{background:rgba(94,207,219,0.2);border-color:#5ecfdb;}
.btn-gauth svg{flex-shrink:0;}

/* send to checkbook button */
.btn-checkbook{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:0.04em;background:var(--green);color:white;border:none;padding:9px 18px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:background .15s;margin-top:12px;width:100%;}
.btn-checkbook:hover{background:#155e35;}
.btn-checkbook:disabled{background:var(--ink4);cursor:not-allowed;}
.btn-checkbook.loading{background:#155e35;pointer-events:none;}

/* checkbook status */
.checkbook-status{font-size:10px;margin-top:6px;padding:7px 10px;border-radius:5px;display:none;}
.checkbook-status.ok{display:block;background:var(--green2);color:var(--green);border:1px solid #a8d8b8;}
.checkbook-status.err{display:block;background:var(--warn2);color:var(--warn);border:1px solid #f0c4b4;}
  .parse-grid,.breakdown-grid,.summary-row{grid-template-columns:1fr;}
  .view{padding:20px 16px;}
  nav{padding:0 16px;}
}
</style>
</head>
<body>

<nav>
  <div class="nav-brand">TSD Food Services <span>Budget</span></div>
  <button class="nav-tab active" onclick="showView('parse')" id="tab-parse">Parse Invoice</button>
  <button class="nav-tab" onclick="showView('ledger')" id="tab-ledger">Ledger <span class="nav-badge" id="ledger-count">0</span></button>
  <div class="nav-right">
    <button class="btn-gauth" id="gauth-btn" onclick="handleAuthClick()">
      <svg width="14" height="14" viewBox="0 0 48 48"><path fill="#fff" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21c10.5 0 20-7.6 20-21 0-1.3-.2-2.7-.5-4z" opacity=".9"/></svg>
      Sign in with Google
    </button>
    <button class="btn-export-xl" onclick="exportXLSX()">↓ Export XLSX</button>
  </div>
</nav>

<!-- API KEY BAR -->
<div class="apikey-bar" id="apikey-bar">
  <label>Anthropic API Key</label>
  <input type="password" id="apikey-input" placeholder="sk-ant-..." oninput="onKeyInput(this)" autocomplete="off">
  <span class="apikey-status" id="apikey-status">Required — never stored, session only</span>
  <a class="apikey-docs" onclick="window.open('https://console.anthropic.com/settings/keys','_blank')">Get a key ↗</a>
</div>

<!-- ── PARSE VIEW ── -->
<div class="view active" id="view-parse">
  <div class="parse-grid">

    <!-- Input -->
    <div class="panel">
      <div class="ph">
        <span class="ph-title">Invoice Input</span>
        <button class="btn-sample" id="sample-btn" onclick="loadSample()">load sample ↓</button>
      </div>
      <div class="pb">
        <div class="mode-tabs">
          <button class="mode-tab active" id="tab-pdf" onclick="setMode('pdf')">📄 PDF Upload</button>
          <button class="mode-tab" id="tab-text" onclick="setMode('text')">✏️ Paste Text</button>
        </div>

        <!-- PDF mode -->
        <div id="mode-pdf">
          <div class="pdf-chip" id="pdf-chip">
            <div class="pdf-chip-icon">
              <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M4 2h8l4 4v12a1 1 0 01-1 1H5a1 1 0 01-1-1V3a1 1 0 011-1z" stroke="white" stroke-width="1.5"/><path d="M12 2v4h4" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg>
            </div>
            <div>
              <div class="pdf-chip-name" id="pdf-name">—</div>
              <div class="pdf-chip-size" id="pdf-size">—</div>
            </div>
            <button class="pdf-chip-rm" onclick="removePdf()">×</button>
          </div>
          <div class="drop-zone" id="drop-zone">
            <input type="file" accept=".pdf" id="file-input" onchange="handleFile(this.files[0])">
            <svg class="drop-icon" width="36" height="36" viewBox="0 0 36 36" fill="none">
              <rect x="5" y="3" width="26" height="30" rx="3" stroke="currentColor" stroke-width="1.5"/>
              <path d="M22 3v8h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

          <svg width="36" height="36" viewBox="0 0 36 36" fill="none"><rect x="6" y="3" width="24" height="30" rx="3" stroke="currentColor" stroke-width="1.5"/><line x1="11" y1="12" x2="25" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="11" y1="18" x2="25" y2="18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="11" y1="24" x2="19" y2="24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <p>Parse an invoice to see<br>structured results here</p>

<div class="view" id="view-ledger">
  <div class="ledger-wrap">
    <div class="ledger-toolbar">
      <div class="ledger-title">Spend Ledger</div>
      <select class="filter-sel" id="filter-vendor" onchange="renderLedger()"><option value="">All vendors</option></select>
      <select class="filter-sel" id="filter-cat" onchange="renderLedger()"><option value="">All categories</option></select>
      <button class="btn-clear-all" onclick="clearLedger()">Clear ledger</button>
    </div>

    <div class="summary-row" id="summary-row"></div>
    <div class="breakdown-grid" id="breakdown-grid"></div>
    <div class="ledger-table-wrap"><div id="ledger-table-inner"></div></div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
const STORAGE_KEY = 'tsd_budget_ledger_v1';
const CATEGORIES = ['Protein','Produce','Dairy','Grains','Frozen','Dry Goods','Beverages','Supplies','Freight','Other'];
const CAT_COLORS = {
  'Protein':'#c23b22','Produce':'#2e7d32','Dairy':'#1565c0','Grains':'#f57f17',
  'Frozen':'#0277bd','Dry Goods':'#6a1e8a','Beverages':'#00695c','Supplies':'#4e342e','Freight':'#546e7a','Other':'#777'
};

let ledger = loadLedger();   // array of invoice records
let lastParsed = null;
let pdfBase64 = null;
let currentMode = 'pdf';

function loadLedger(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'); }catch{ return []; }
}
function saveLedger(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(ledger)); }

// ─────────────────────────────────────────────
// NAV
// ─────────────────────────────────────────────
function showView(v){
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.getElementById('tab-'+v).classList.add('active');
  if(v==='ledger') renderLedger();
}
function updateBadge(){ document.getElementById('ledger-count').textContent = ledger.length; }

// ─────────────────────────────────────────────
// INPUT MODE
// ─────────────────────────────────────────────
function setMode(m){
  currentMode = m;
  document.getElementById('mode-pdf').style.display = m==='pdf'?'block':'none';
  document.getElementById('mode-text').style.display = m==='text'?'block':'none';
  document.getElementById('tab-pdf').classList.toggle('active',m==='pdf');
  document.getElementById('tab-text').classList.toggle('active',m==='text');
  document.getElementById('sample-btn').style.display = m==='text'?'inline':'none';
}

// ─────────────────────────────────────────────
// PDF HANDLING
// ─────────────────────────────────────────────
const dz = document.getElementById('drop-zone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag-over');});
dz.addEventListener('dragleave',()=>dz.classList.remove('drag-over'));
dz.addEventListener('drop',e=>{
  e.preventDefault(); dz.classList.remove('drag-over');
  const f = e.dataTransfer.files[0];
  if(f&&f.type==='application/pdf') handleFile(f);
  else showErr('Please drop a PDF file.');
});

function handleFile(file){
  if(!file) return;
  if(file.size > 10*1024*1024){ showErr('File too large — max 10 MB.'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    pdfBase64 = e.target.result.split(',')[1];
    document.getElementById('pdf-chip').classList.add('on');
    document.getElementById('drop-zone').style.display = 'none';
    document.getElementById('pdf-name').textContent = file.name;
    document.getElementById('pdf-size').textContent = fmtSize(file.size);
  };
  reader.readAsDataURL(file);
}
function removePdf(){
  pdfBase64 = null;
  document.getElementById('pdf-chip').classList.remove('on');
  document.getElementById('drop-zone').style.display = 'flex';
  document.getElementById('file-input').value = '';
}
function fmtSize(b){ return b<1024*1024 ? Math.round(b/1024)+' KB' : (b/(1024*1024)).toFixed(1)+' MB'; }

// ─────────────────────────────────────────────
// SYSTEM PROMPT
// ─────────────────────────────────────────────
const SYSTEM = `You are an invoice data extractor for TSD Food Services.
Respond ONLY with a raw JSON object. The very first character must be { and the very last must be }.
No markdown. No code fences. No commentary.

Schema:
{
  "vendor": "string",
  "invoice_number": "string or null",
  "invoice_date": "YYYY-MM-DD or null",
  "po_number": "string or null",
  "special_instructions": "string or null — capture any meal description, delivery notes, or special instructions printed on the invoice (e.g. 'Meals for Dinner', 'Meals for Lunch')",
  "line_items": [
    { "description": "string", "item_code": "string or null", "qty": 0, "unit": "string", "unit_price": 0.00, "extended": 0.00 }
  ],
  "subtotal": 0.00,
  "tax": 0.00,
  "freight": 0.00,
  "grand_total": 0.00,
  "discrepancies": "string or null"
}
Rules: numbers are numeric type; dates YYYY-MM-DD or null; missing fields use null; never fabricate.
If not an invoice: {"error":"Not an invoice"}`;

// ─────────────────────────────────────────────
// API KEY  (session-only, never persisted)
// ─────────────────────────────────────────────
let apiKey = '';

function onKeyInput(el){
  apiKey = el.value.trim();
  const status = document.getElementById('apikey-status');
  const bar    = document.getElementById('apikey-bar');
  if(apiKey.startsWith('sk-ant-') && apiKey.length > 20){
    el.classList.add('set');
    status.textContent = '✓ Key set — session only, not stored';
    status.className = 'apikey-status ok';
    bar.style.background = '#f2fbf5';
    bar.style.borderBottomColor = '#6ab07a';
  } else {
    el.classList.remove('set');
    status.textContent = 'Required — never stored, session only';
    status.className = 'apikey-status';
    bar.style.background = '';
    bar.style.borderBottomColor = '';
  }
}

// ─────────────────────────────────────────────
// PARSE
// ─────────────────────────────────────────────

// FIX 1: Max safe base64 size ~4 MB (3 MB raw) before fetch gets unreliable
const MAX_PDF_B64_CHARS = 4 * 1024 * 1024;

async function parseInvoice(){
  const btn = document.getElementById('parse-btn');
  clearErr();
  document.getElementById('size-warn').classList.remove('on');

  // FIX 2: Require API key — this was the root cause of "Failed to fetch"
  if(!apiKey){
    showErr('Enter your Anthropic API key in the bar above first. It stays in this tab only and is never stored.');
    return;
  }

  let content;
  if(currentMode==='pdf'){
    if(!pdfBase64){ showErr('Upload a PDF first.'); return; }

    // FIX 3: Warn if PDF is too large — large scanned PDFs cause fetch to abort
    if(pdfBase64.length > MAX_PDF_B64_CHARS){
      const mb = (pdfBase64.length / (1024*1024)).toFixed(1);
      const warn = document.getElementById('size-warn');
      warn.textContent = `PDF is large (${mb} MB encoded). If this fails, try: paste text mode, or open the PDF, select all text, and paste instead.`;
      warn.classList.add('on');
      // Still attempt — Anthropic supports up to ~32 MB, but local fetch can choke earlier
    }

    content = [
      { type:'document', source:{ type:'base64', media_type:'application/pdf', data:pdfBase64 } },
      { type:'text', text:'Parse this invoice and return structured JSON as instructed.' }
    ];
  } else {
    const t = document.getElementById('invoice-text').value.trim();
    if(!t){ showErr('Paste some invoice text first.'); return; }
    content = `Parse this invoice:\n\n${t}`;
  }

  btn.classList.add('loading'); btn.disabled = true;

  try {
    // FIX 1+2: Add required Anthropic headers — x-api-key and anthropic-version
    // The "Failed to fetch" error was caused by these being absent
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':        'application/json',
        'x-api-key':           apiKey,               // ← was missing
        'anthropic-version':   '2023-06-01',          // ← was missing
        'anthropic-dangerous-direct-browser-access': 'true'  // required for browser calls
      },
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:2048,
        system:SYSTEM,
        messages:[{role:'user',content}]
      })
    });

    const data = await res.json();
    if(!res.ok) throw new Error(data.error?.message||`API error ${res.status}`);

    const raw = data.content[0].text;
    const clean = raw.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/i,'').trim();
    const parsed = JSON.parse(clean);

    if(parsed.error){ showErr(parsed.error); return; }
    lastParsed = parsed;
    renderResult(parsed, raw);

  } catch(err){
    // Better error diagnosis
    let msg = err.message;
    if(msg==='Failed to fetch'){
      msg = 'Failed to fetch — likely causes: (1) check API key is correct, (2) PDF may be too large — try paste text mode, (3) network/firewall blocking api.anthropic.com';
    }
    showErr(msg);
    console.error('Full error:', err);
  } finally {
    btn.classList.remove('loading'); btn.disabled = false;
  }
}

// ─────────────────────────────────────────────
// RENDER PARSED RESULT
// ─────────────────────────────────────────────
function renderResult(d, rawText){
  const c = document.getElementById('result-content');
  let html = '';

  // Vendor header
  html += `<div class="vendor-row">
    <div>
      <div class="vendor-name">${esc(d.vendor||'Unknown Vendor')}</div>
      <div class="vendor-meta">`;
  if(d.invoice_date) html += `Date: ${d.invoice_date}<br>`;
  if(d.po_number)    html += `PO: ${esc(d.po_number)}`;
  html += `</div></div>`;
  if(d.invoice_number) html += `<div class="inv-badge">#${esc(d.invoice_number)}</div>`;
  html += `</div>`;

  // Flag
  if(d.discrepancies) html += `<div class="flag-box"><strong>⚠ Flag</strong>${esc(d.discrepancies)}</div>`;

  // Line items
  if(d.line_items?.length){
    html += `<div class="sec-label">Line Items</div>
    <table><thead><tr>
      <th>Description</th><th class="r">Qty</th><th class="r">Unit Price</th><th class="r">Extended</th>
    </tr></thead><tbody>`;
    d.line_items.forEach(it=>{
      html += `<tr>
        <td>${esc(it.description)}${it.item_code?`<div class="item-code">${esc(it.item_code)}</div>`:''}</td>
        <td class="r">${it.qty??'—'} ${esc(it.unit??'')}</td>
        <td class="r">${fmt(it.unit_price)}</td>
        <td class="r">${fmt(it.extended)}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
  }

  // Totals
  html += `<div class="totals">`;
  if(d.subtotal!=null) html += trow('Subtotal',d.subtotal);
  if(d.tax&&d.tax!==0) html += trow('Tax',d.tax);
  if(d.freight&&d.freight!==0) html += trow('Freight',d.freight);
  if(d.grand_total!=null) html += `<div class="trow grand"><span class="tl">Total</span><span class="tv">${fmt(d.grand_total)}</span></div>`;
  html += `</div>`;

  // ── CATEGORY ASSIGNMENT ──────────────────────
  // This is the bridge between the parser and the ledger.
  // Each line item gets a category dropdown; committing adds one ledger record per item.
  html += `<div class="cat-assign">
    <div class="cat-assign-title">Assign categories → add to ledger</div>`;

  d.line_items?.forEach((it,i)=>{
    const opts = CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('');
    html += `<div class="cat-row">
      <label title="${esc(it.description)}">${esc(it.description)}</label>
      <select class="cat-sel" id="cat-${i}">${opts}</select>
    </div>`;
  });

  // Freight as its own line if present
  if(d.freight&&d.freight!==0){
    html += `<div class="cat-row">
      <label>Freight / Delivery</label>
      <select class="cat-sel" id="cat-freight"><option value="Freight" selected>Freight</option>${CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
    </div>`;
  }

  html += `<button class="btn-commit" onclick="commitToLedger()">+ Add to Ledger</button>
  <button class="btn-checkbook" id="checkbook-btn" onclick="sendToCheckbook()" title="Append invoice total to your live Google Sheet Checkbook">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
    → Send to Checkbook
  </button>
  <div class="checkbook-status" id="checkbook-status"></div>
  </div>`;

  c.innerHTML = html;
  c.classList.add('on');
  document.getElementById('result-empty').classList.add('hide');
  document.getElementById('result-export').style.display = 'flex';
  document.getElementById('raw-toggle').style.display = 'inline';
  document.getElementById('raw-block').textContent = JSON.stringify(d,null,2);
  document.getElementById('raw-block').classList.remove('on');
  document.getElementById('raw-toggle').textContent = 'view JSON';
}

// ─────────────────────────────────────────────
// COMMIT TO LEDGER  ← the wiring moment
// ─────────────────────────────────────────────
function commitToLedger(){
  if(!lastParsed) return;
  const d = lastParsed;
  const invoiceId = 'INV-'+Date.now();
  const addedAt = new Date().toISOString();

  // One ledger row per line item
  d.line_items?.forEach((it,i)=>{
    const cat = document.getElementById('cat-'+i)?.value || 'Other';
    ledger.push({
      id: invoiceId+'-'+i,
      invoiceId,
      addedAt,
      vendor: d.vendor||'Unknown',
      invoice_number: d.invoice_number,
      invoice_date: d.invoice_date,
      po_number: d.po_number,
      item_code: it.item_code,
      description: it.description,
      qty: it.qty,
      unit: it.unit,
      unit_price: it.unit_price,
      extended: it.extended||0,
      category: cat
    });
  });

  // Freight as separate row if present
  if(d.freight&&d.freight!==0){
    const cat = document.getElementById('cat-freight')?.value||'Freight';
    ledger.push({
      id: invoiceId+'-freight',
      invoiceId,
      addedAt,
      vendor: d.vendor||'Unknown',
      invoice_number: d.invoice_number,
      invoice_date: d.invoice_date,
      po_number: d.po_number,
      item_code: null,
      description: 'Freight / Delivery',
      qty: 1,
      unit: 'EA',
      unit_price: d.freight,
      extended: d.freight,
      category: cat
    });
  }

  saveLedger();
  updateBadge();

  // Flash the commit button, then switch to ledger
  const btn = document.querySelector('.btn-commit');
  if(btn){ btn.textContent='✓ Added!'; btn.style.background='var(--green)'; }
  setTimeout(()=>showView('ledger'),900);
}

// ─────────────────────────────────────────────
// LEDGER RENDER
// ─────────────────────────────────────────────
function renderLedger(){
  updateFilters();
  const vf = document.getElementById('filter-vendor').value;
  const cf = document.getElementById('filter-cat').value;
  const rows = ledger.filter(r=>(!vf||r.vendor===vf)&&(!cf||r.category===cf));

  renderSummary(rows);
  renderBreakdown(rows);
  renderTable(rows);
}

function updateFilters(){
  const vendors = [...new Set(ledger.map(r=>r.vendor))].sort();
  const cats    = [...new Set(ledger.map(r=>r.category))].sort();
  const vSel = document.getElementById('filter-vendor');
  const cSel = document.getElementById('filter-cat');
  const vv = vSel.value, cv = cSel.value;
  vSel.innerHTML = '<option value="">All vendors</option>'+vendors.map(v=>`<option${vv===v?' selected':''}>${v}</option>`).join('');
  cSel.innerHTML = '<option value="">All categories</option>'+cats.map(c=>`<option${cv===c?' selected':''}>${c}</option>`).join('');
}

function renderSummary(rows){
  const total = rows.reduce((s,r)=>s+(r.extended||0),0);
  const invoices = new Set(rows.map(r=>r.invoiceId)).size;
  const vendors  = new Set(rows.map(r=>r.vendor)).size;
  const avgInv   = invoices ? total/invoices : 0;

  document.getElementById('summary-row').innerHTML = `
    <div class="scard"><div class="scard-label">Total Spend</div><div class="scard-val teal">${fmtDollar(total)}</div><div class="scard-sub">${rows.length} line items</div></div>
    <div class="scard"><div class="scard-label">Invoices</div><div class="scard-val">${invoices}</div><div class="scard-sub">processed</div></div>
    <div class="scard"><div class="scard-label">Vendors</div><div class="scard-val">${vendors}</div><div class="scard-sub">unique</div></div>
    <div class="scard"><div class="scard-label">Avg Invoice</div><div class="scard-val">${fmtDollar(avgInv)}</div><div class="scard-sub">per invoice</div></div>`;
}

function renderBreakdown(rows){
  const total = rows.reduce((s,r)=>s+(r.extended||0),0)||1;

  // Vendor bars
  const byVendor = {};
  rows.forEach(r=>{ byVendor[r.vendor]=(byVendor[r.vendor]||0)+(r.extended||0); });
  const vendors = Object.entries(byVendor).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxV = vendors[0]?.[1]||1;

  let vHtml = `<div class="scard"><div class="bsection-title">Spend by Vendor</div>`;
  if(!vendors.length){ vHtml += `<div style="font-size:11px;color:var(--ink4);padding:20px 0;text-align:center">No data</div>`; }
  vendors.forEach(([v,amt])=>{
    vHtml += `<div class="vendor-bar-row">
      <div class="vbar-label" title="${esc(v)}">${esc(v)}</div>
      <div class="vbar-track"><div class="vbar-fill" style="width:${(amt/maxV*100).toFixed(1)}%"></div></div>
      <div class="vbar-amt">${fmtDollar(amt)}</div>
    </div>`;
  });
  vHtml += `</div>`;

  // Category dots
  const byCat = {};
  rows.forEach(r=>{ byCat[r.category]=(byCat[r.category]||0)+(r.extended||0); });
  const cats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);

  let cHtml = `<div class="scard"><div class="bsection-title">Spend by Category</div>`;
  if(!cats.length){ cHtml += `<div style="font-size:11px;color:var(--ink4);padding:20px 0;text-align:center">No data</div>`; }
  cats.forEach(([cat,amt])=>{
    const pct = (amt/total*100).toFixed(1);
    cHtml += `<div class="cat-bar-row">
      <div class="cbar-dot" style="background:${CAT_COLORS[cat]||'#888'}"></div>
      <div class="cbar-label">${esc(cat)}</div>
      <div class="cbar-amt">${fmtDollar(amt)} <span style="color:var(--ink4)">(${pct}%)</span></div>
    </div>`;
  });
  cHtml += `</div>`;

  document.getElementById('breakdown-grid').innerHTML = vHtml + cHtml;
}

function renderTable(rows){
  const el = document.getElementById('ledger-table-inner');
  if(!rows.length){
    el.innerHTML = `<div class="ledger-empty">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none"><rect x="6" y="3" width="28" height="34" rx="3" stroke="currentColor" stroke-width="1.5" opacity=".3"/><line x1="12" y1="14" x2="28" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".3"/><line x1="12" y1="21" x2="28" y2="21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".3"/><line x1="12" y1="28" x2="20" y2="28" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".3"/></svg>
      <p>No entries yet — parse an invoice<br>and add it to the ledger.</p>
    </div>`;
    return;
  }

  const total = rows.reduce((s,r)=>s+(r.extended||0),0);

  // Group by invoice
  const groups = {};
  rows.forEach(r=>{ (groups[r.invoiceId]=groups[r.invoiceId]||[]).push(r); });

  let html = `<table class="lt"><thead><tr>
    <th>Vendor</th><th>Date</th><th>Description</th>
    <th>Category</th><th class="r">Qty</th><th class="r">Unit Price</th><th class="r">Extended</th><th></th>
  </tr></thead><tbody>`;

  Object.entries(groups).forEach(([invId,items])=>{
    const first = items[0];
    const groupTotal = items.reduce((s,r)=>s+(r.extended||0),0);
    const invLabel = first.invoice_number ? `#${first.invoice_number}` : invId.slice(-8);
    html += `<tr class="group-header"><td colspan="7">${esc(first.vendor)} — Invoice ${esc(invLabel)} — ${first.invoice_date||'no date'} — <strong>${fmtDollar(groupTotal)}</strong></td><td></td></tr>`;
    items.forEach(r=>{
      const color = CAT_COLORS[r.category]||'#888';
      html += `<tr>
        <td style="color:var(--ink3);font-size:10px">${esc(r.vendor)}</td>
        <td style="color:var(--ink3);font-size:10px">${r.invoice_date||'—'}</td>
        <td>${esc(r.description)}${r.item_code?`<div class="item-code">${esc(r.item_code)}</div>`:''}</td>
        <td><span class="cat-pill" style="background:${color}22;color:${color}">${esc(r.category)}</span></td>
        <td class="r">${r.qty??'—'} ${esc(r.unit||'')}</td>
        <td class="r">${fmt(r.unit_price)}</td>
        <td class="r">${fmt(r.extended)}</td>
        <td><button class="del-btn" onclick="deleteRow('${r.id}')" title="Remove">✕</button></td>
      </tr>`;
    });
  });

  html += `</tbody><tfoot><tr>
    <td colspan="6" style="font-size:11px;color:var(--ink3)">Total (${rows.length} items)</td>
    <td class="r" style="font-family:var(--serif);font-size:16px;font-weight:600;color:var(--teal4)">${fmtDollar(total)}</td>
    <td></td>
  </tr></tfoot></table>`;

  el.innerHTML = html;
}

// XLSX EXPORT  ← uses SheetJS loaded via CDN
// ─────────────────────────────────────────────
function exportXLSX(){
  if(!ledger.length){ alert('No data in ledger yet.'); return; }

  const wb = XLSX.utils.book_new();

  // Sheet 1: Full ledger
  const ledgerData = ledger.map(r=>({
    'Invoice ID':   r.invoiceId,
    'Vendor':       r.vendor,
    'Invoice #':    r.invoice_number||'',
    'Invoice Date': r.invoice_date||'',
    'PO Number':    r.po_number||'',
    'Item Code':    r.item_code||'',
    'Description':  r.description,
    'Category':     r.category,
    'Qty':          r.qty,
    'Unit':         r.unit,
    'Unit Price':   r.unit_price,
    'Extended':     r.extended
  }));
  const ws1 = XLSX.utils.json_to_sheet(ledgerData);
  ws1['!cols'] = [10,16,12,14,12,12,32,12,6,6,10,10].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb, ws1, 'Ledger');

  // Sheet 2: Vendor summary
  const byVendor = {};
  ledger.forEach(r=>{ byVendor[r.vendor]=(byVendor[r.vendor]||0)+(r.extended||0); });
  const vs = Object.entries(byVendor).sort((a,b)=>b[1]-a[1]).map(([v,t])=>({'Vendor':v,'Total Spend':t}));
  const ws2 = XLSX.utils.json_to_sheet(vs);
  ws2['!cols'] = [{wch:20},{wch:14}];
  XLSX.utils.book_append_sheet(wb, ws2, 'By Vendor');

  // Sheet 3: Category summary
  const byCat = {};
  ledger.forEach(r=>{ byCat[r.category]=(byCat[r.category]||0)+(r.extended||0); });
  const cs = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([c,t])=>({'Category':c,'Total Spend':t}));
  const ws3 = XLSX.utils.json_to_sheet(cs);
  ws3['!cols'] = [{wch:16},{wch:14}];
  XLSX.utils.book_append_sheet(wb, ws3, 'By Category');

  XLSX.writeFile(wb, 'TSD_Food_Services_Budget.xlsx');
}

function dl(content,name,type){
  const a = document.createElement('a');

}

  gTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GCONFIG.clientId,

// Resolve vendor key from parsed vendor string
function resolveVendor(vendorStr){
  if(!vendorStr) return null;
  const key = vendorStr.toLowerCase().trim();
  // Direct match
  if(GCONFIG.vendorMap[key]) return GCONFIG.vendorMap[key];
  // Partial match
  for(const [k,v] of Object.entries(GCONFIG.vendorMap)){
    if(key.includes(k) || k.includes(key)) return v;
  }
  return null; // unknown vendor — will use Miscellaneous path
}

// Build the description string matching your existing pattern:
// "Special Instructions Invoice#XXXXXX"  or  "Vendor Description Invoice#XXXXXX"
function buildDescription(d){
  const parts = [];
  // Prefer special_instructions if captured, otherwise use a generic description
  if(d.special_instructions) parts.push(d.special_instructions.trim());
  if(d.invoice_number)        parts.push(`Invoice#${d.invoice_number}`);
  return parts.join(' ') || `Invoice#${d.invoice_number||'unknown'}`;
}

async function getLastRow(sheetName, col='A'){
  // We use append with insertDataOption=INSERT_ROWS which auto-finds last row
  // No need to fetch — the append API handles it
  return null;
}

// Write a row to a sheet tab using the Sheets API values.append
async function appendRow(sheetName, values){
  const range = encodeURIComponent(`'${sheetName}'!A:F`);
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${GCONFIG.sheetId}/values/${range}:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`;
  const res = await fetch(url, {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${gAccessToken}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ values: [values] })
  });
  if(!res.ok){
    const err = await res.json();
    throw new Error(err.error?.message || `Sheets API error ${res.status}`);
  }
  return await res.json();
}

async function sendToCheckbook(){
  const btn    = document.getElementById('checkbook-btn');
  const status = document.getElementById('checkbook-status');
  status.className = 'checkbook-status';
  status.style.display = 'none';

  if(!lastParsed){ showCheckbookStatus('err','No parsed invoice — parse one first.'); return; }
  if(!gSignedIn || !gAccessToken){
    showCheckbookStatus('err','Sign in with Google first (top right button).');
    return;
  }

  const d = lastParsed;
  if(!d.grand_total){ showCheckbookStatus('err','Invoice has no grand total — cannot send.'); return; }

  btn.classList.add('loading');
  btn.textContent = '⏳ Sending...';

  try {
    const vendor   = resolveVendor(d.vendor);
    const desc     = buildDescription(d);
    const date     = d.invoice_date || new Date().toISOString().slice(0,10);
    const amount   = d.grand_total;
    const reqNum   = vendor?.req || '6-468-008';
    const vendName = vendor?.name || d.vendor || 'Unknown';

    // ── Row 1: Org 468 ──────────────────────────────
    // Columns: Req# | Date | Vendor | Basic Description | Cost | (balance formula handled by sheet)
    await appendRow('Org 468', [reqNum, date, vendName, desc, amount]);

    // ── Row 2: Vendor tab (if mapped) ───────────────
    // Columns: Date | Amount | (balance formula handled by sheet)
    let vendorWritten = false;
    if(vendor?.sheet){
      await appendRow(vendor.sheet, [date, amount]);
      vendorWritten = true;
    }

    const msg = vendorWritten
      ? `✓ Written to Org 468 + ${vendor.sheet} tab — ${fmtDollar(amount)} on ${date}`
      : `✓ Written to Org 468 — ${fmtDollar(amount)} on ${date} (vendor tab not found — check vendor name)`;

    showCheckbookStatus('ok', msg);

  } catch(err){
    showCheckbookStatus('err', 'Sheets error: ' + err.message);
    console.error(err);
  } finally {
    btn.classList.remove('loading');
    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>→ Send to Checkbook`;
  }
}

function showCheckbookStatus(type, msg){
  const el = document.getElementById('checkbook-status');
  if(!el) return;
  el.textContent = msg;
  el.className = 'checkbook-status ' + type;
  el.style.display = 'block';
}
